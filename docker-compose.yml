services:
  postgres:
    image: postgres:17
    container_name: restaurant-ops-postgres
    environment:
      POSTGRES_DB: restaurant_ops
      POSTGRES_USER: restaurant_ops
      POSTGRES_PASSWORD: restaurant_ops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_ops -d restaurant_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: